name: Bug report
description: Report a reproducible problem with Vibe Terminal.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include credentials, personal data, or security-sensitive details. Use private vulnerability reporting for security issues."
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (Settings > About) or the commit SHA.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant logs
    validations:
      required: true
