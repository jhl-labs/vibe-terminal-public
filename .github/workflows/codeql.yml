name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@181d5eefc20863364f96762470ba6f862bdef56b # v3.28.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@181d5eefc20863364f96762470ba6f862bdef56b # v3.28.0
        with:
          category: "/language:${{ matrix.language }}"
