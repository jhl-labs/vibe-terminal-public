name: vibe_terminal
description: A cross-platform SSH terminal app.
publish_to: none
version: 0.20.0+50
environment:
  sdk: ^3.12.2
dependencies:
  timezone: ^0.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dartssh2: ^4.1.0
  xterm: ^4.0.0
  drift: ^2.35.0
  flutter_secure_storage: ^10.3.4
  freezed_annotation: ^3.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  file_picker: 11.0.3
  flutter_pty: 0.4.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.3
  flutter_markdown_plus: ^1.0.12
  super_clipboard: ^0.9.0
  flutter_local_notifications: ^22.3.1
  clock: ^1.1.1
  package_info_plus: ^9.0.1
  cryptography: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/cascadia/OFL.txt
    - assets/fonts/d2coding/OFL.txt
    - assets/fonts/jetbrains_mono/OFL.txt
  fonts:
    - family: Cascadia Mono
      fonts:
        - asset: assets/fonts/cascadia/CascadiaMono-Regular.ttf
        - asset: assets/fonts/cascadia/CascadiaMono-Bold.ttf
          weight: 700
    - family: Cascadia Code
      fonts:
        - asset: assets/fonts/cascadia/CascadiaCode-Regular.ttf
        - asset: assets/fonts/cascadia/CascadiaCode-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Bold.ttf
          weight: 700
    - family: D2Coding
      fonts:
        - asset: assets/fonts/d2coding/D2Coding-Regular.ttf
        - asset: assets/fonts/d2coding/D2Coding-Bold.ttf
          weight: 700
dependency_overrides:
  flutter_pty:
    path: ./vendor/flutter_pty
  xterm:
    path: ./vendor/xterm
