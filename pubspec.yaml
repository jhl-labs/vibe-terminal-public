name: vibe_terminal
description: A cross-platform SSH terminal app.
publish_to: none
version: 0.10.1+26
environment:
  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dartssh2: ^2.22.3
  xterm: ^4.0.0
  drift: ^2.35.0
  flutter_secure_storage: ^10.3.1
  freezed_annotation: ^3.1.0
  path: ^1.9.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  file_picker: 11.0.2
  flutter_pty: 0.4.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  flutter_markdown_plus: ^1.0.12
  super_clipboard: ^0.9.0
  flutter_local_notifications: ^18.0.1
  clock: ^1.1.3
  package_info_plus: ^9.0.1
  cryptography: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
dependency_overrides:
  flutter_pty:
    path: ./vendor/flutter_pty
  xterm:
    path: ./vendor/xterm
